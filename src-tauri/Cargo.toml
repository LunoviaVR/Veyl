[package]
name = "veyl"
version = "0.1.0"
description = "Task Manager, HWiNFO and frame-time monitor in one window"
edition = "2021"
rust-version = "1.82"

[lib]
name = "veyl_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
parking_lot = "0.12"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "component"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_System_Performance",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_Graphics_Direct3D",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
