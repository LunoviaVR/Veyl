# Builds the Windows installer, signs the updater artifacts and drafts a GitHub release.
# Trigger: push a tag like v1.0.0 (the version in tauri.conf.json, package.json and
# Cargo.toml must match). Publish the draft to make the update visible to installed apps.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of %USERPROFILE%\.tauri\veyl.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty if generated without one)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      # Anonymous GitHub release downloads can time out (504) and fail the bundle step; fetch the
      # bundler's NSIS toolset with the job token instead.
      # shortcut: versions are the ones @tauri-apps/cli 2.12.4 uses; update them when the CLI changes NSIS.
      - name: Fetch NSIS toolset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $t = "$env:LOCALAPPDATA\tauri"
          gh release download nsis-3.13 -R tauri-apps/binary-releases -p nsis-3.13.zip -D $env:RUNNER_TEMP
          Expand-Archive "$env:RUNNER_TEMP\nsis-3.13.zip" $t
          Rename-Item "$t\nsis-3.13" NSIS
          gh release download nsis_tauri_utils-v0.5.3 -R tauri-apps/nsis-tauri-utils -p nsis_tauri_utils.dll -D "$t\NSIS\Plugins\x86-unicode\additional"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Veyl ${{ github.ref_name }}
          releaseBody: "What's new: https://github.com/LunoviaVR/Veyl/blob/${{ github.ref_name }}/CHANGELOG.md"
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --config {"bundle":{"createUpdaterArtifacts":true}}
