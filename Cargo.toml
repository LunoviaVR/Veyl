[workspace]
resolver = "2"
members = ["crates/core", "crates/windows-platform", "crates/history-storage", "src-tauri"]

[workspace.package]
version = "1.0.7"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
veyl-core = { path = "crates/core" }
veyl-windows = { path = "crates/windows-platform" }
veyl-storage = { path = "crates/history-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
parking_lot = "0.12"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"
